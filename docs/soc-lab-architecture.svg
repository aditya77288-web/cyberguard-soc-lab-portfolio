<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CyberGuard SOC Lab — Architecture</title>
  <desc id="desc">An educational, simulated SOC workflow from sample telemetry and threat intelligence through event exploration, Sigma detection, MITRE ATT&amp;CK mapping, incident response, and reporting. Data is stored locally in the browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1b2b"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102b40"/><stop offset="1" stop-color="#102338"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4cc9f0"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#647d93"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1f8}.muted{fill:#9bb0c2}.subtle{fill:#7890a6}.cyan{fill:#65dcf4}.green{fill:#6ee7b7}.amber{fill:#f6c76b}.red{fill:#ff8f91}.card{fill:#102235;stroke:#29445b;stroke-width:1.5}.soft{fill:#0c1a29;stroke:#20394e;stroke-width:1.3}.pill{fill:#153248;stroke:#2e5b72;stroke-width:1}.head{font-size:20px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="130" r="230" fill="#11324a" opacity=".14"/><circle cx="90" cy="850" r="260" fill="#103049" opacity=".12"/>
  <text x="76" y="72" class="label cyan">CYBERGUARD  /  EDUCATIONAL ENVIRONMENT</text>
  <text x="76" y="126" font-size="40" font-weight="750">SOC Lab Architecture</text>
  <text x="76" y="158" font-size="16" class="muted">A simulated security operations workflow for learning detection, investigation, and response.</text>
  <rect x="1266" y="66" width="258" height="38" rx="19" fill="#142c32" stroke="#2d695e"/>
  <circle cx="1287" cy="85" r="5" fill="#6ee7b7"/><text x="1302" y="90" class="small green" font-weight="700">SIMULATED · LOCAL DEMO DATA</text>

  <!-- telemetry sources -->
  <text x="76" y="222" class="label subtle">01  /  INPUTS</text>
  <rect x="76" y="244" width="284" height="310" rx="18" class="card"/>
  <text x="100" y="282" class="head">Telemetry &amp; context</text>
  <text x="100" y="307" class="body muted">Curated demonstration data</text>
  <rect x="100" y="331" width="236" height="48" rx="10" class="soft"/><circle cx="121" cy="355" r="6" fill="#65dcf4"/><text x="140" y="360" class="body">Windows / Sysmon events</text>
  <rect x="100" y="389" width="236" height="48" rx="10" class="soft"/><circle cx="121" cy="413" r="6" fill="#65dcf4"/><text x="140" y="418" class="body">Firewall &amp; IDS events</text>
  <rect x="100" y="447" width="236" height="48" rx="10" class="soft"/><circle cx="121" cy="471" r="6" fill="#f6c76b"/><text x="140" y="476" class="body">Threat intelligence samples</text>
  <text x="100" y="526" class="small subtle">No live endpoint or SIEM connection</text>

  <!-- core workflow -->
  <text x="418" y="222" class="label subtle">02  /  DETECT &amp; TRIAGE</text>
  <rect x="418" y="244" width="350" height="146" rx="18" class="card"/>
  <rect x="442" y="268" width="40" height="40" rx="11" fill="#123b50"/><text x="454" y="294" class="cyan" font-size="20" font-weight="700">01</text>
  <text x="498" y="286" class="head">Event Explorer</text><text x="442" y="330" class="body muted">Search, filter, and inspect sample events</text>
  <text x="442" y="358" class="small subtle">Timeline · source · severity · event details</text>

  <rect x="418" y="422" width="350" height="174" rx="18" class="card"/>
  <rect x="442" y="446" width="40" height="40" rx="11" fill="#123b50"/><text x="454" y="472" class="cyan" font-size="20" font-weight="700">02</text>
  <text x="498" y="464" class="head">Sigma Detection Engine</text><text x="442" y="508" class="body muted">Evaluate events against enabled rules</text>
  <rect x="442" y="532" width="126" height="30" rx="15" class="pill"/><text x="458" y="552" class="small cyan">Rule matches</text>
  <rect x="578" y="532" width="164" height="30" rx="15" class="pill"/><text x="594" y="552" class="small cyan">Findings &amp; rationale</text>

  <rect x="830" y="244" width="300" height="146" rx="18" class="card"/>
  <text x="854" y="282" class="head">MITRE ATT&amp;CK</text><text x="854" y="309" class="body muted">Technique mapping &amp; coverage</text>
  <text x="854" y="346" class="small subtle">Tactics · techniques · detection links</text>
  <rect x="830" y="422" width="300" height="174" rx="18" class="card"/>
  <text x="854" y="462" class="head">Security Alerts</text><text x="854" y="490" class="body muted">Separate seeded queue for analyst triage</text>
  <rect x="854" y="523" width="111" height="30" rx="15" fill="#39252b" stroke="#71424a"/><text x="872" y="543" class="small red">Severity</text>
  <rect x="975" y="523" width="128" height="30" rx="15" class="pill"/><text x="991" y="543" class="small cyan">Rule evidence</text>

  <!-- response & output -->
  <text x="1190" y="222" class="label subtle">03  /  RESPOND</text>
  <rect x="1190" y="244" width="334" height="208" rx="18" class="card"/>
  <text x="1216" y="284" class="head">Incident Response</text><text x="1216" y="312" class="body muted">Manual escalation from alert triage</text>
  <rect x="1216" y="337" width="130" height="34" rx="9" class="soft"/><text x="1232" y="359" class="small">Status &amp; owner</text>
  <rect x="1356" y="337" width="142" height="34" rx="9" class="soft"/><text x="1372" y="359" class="small">Evidence notes</text>
  <rect x="1216" y="382" width="282" height="42" rx="9" fill="#142d31" stroke="#2a5e56"/><text x="1232" y="408" class="small green">Playbooks guide analyst actions</text>
  <rect x="1190" y="484" width="334" height="112" rx="18" class="card"/>
  <text x="1216" y="523" class="head">Incident Reports</text><text x="1216" y="552" class="body muted">Document outcomes and review status</text>

  <!-- arrows -->
  <path d="M360 350 H397 V318 H410" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M592 390 V414" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M768 490 H805 V318 H822" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1130 510 H1182" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1357 452 V476" fill="none" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="830" y="622" class="small subtle">Detection matches stay separate from the seeded alert queue</text>

  <!-- platform / persistence -->
  <rect x="76" y="686" width="1448" height="208" rx="20" fill="url(#hero)" stroke="#29445b" stroke-width="1.5"/>
  <text x="104" y="725" class="label cyan">SHARED APPLICATION LAYER</text>
  <text x="104" y="761" font-size="22" font-weight="700">CyberGuard SOC Lab interface</text>
  <text x="104" y="791" class="body muted">Dashboard · data sources · detection rules · event explorer · ATT&amp;CK · incidents · reports · threat intelligence</text>
  <line x1="104" y1="814" x2="1496" y2="814" stroke="#29445b"/>
  <rect x="104" y="834" width="263" height="38" rx="10" class="soft"/><text x="122" y="858" class="small">Browser localStorage demo state</text>
  <rect x="383" y="834" width="263" height="38" rx="10" class="soft"/><text x="401" y="858" class="small">Shared derived metrics</text>
  <rect x="662" y="834" width="263" height="38" rx="10" class="soft"/><text x="680" y="858" class="small">Simulated data and actions</text>
  <rect x="941" y="834" width="555" height="38" rx="10" fill="#142d31" stroke="#2a5e56"/><text x="959" y="858" class="small green">Portfolio lab · not production monitoring or automated containment</text>
  <text x="76" y="944" class="small subtle">CYBERGUARD SOC LAB  ·  CONCEPTUAL ARCHITECTURE  ·  EDUCATIONAL DEMONSTRATION</text>
  <text x="1415" y="944" class="small subtle">v1.0</text>
</svg>

